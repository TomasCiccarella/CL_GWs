              cuartico_tablaII_T_ns, cuartico_tablaII_T_r, cuartico_E1_lam_eq38, cuartico_T1_lam_eq38,
              cuartico_E5_lam_eq38]

  - id: reescaleo-a-hoy
    statement: >
      El espectro de GWs de CosmoLattice se lleva a hoy con f_0 = k~ (omega_*/f_*)^(1/2) eps^(1/4)
      C_f/(a_e rho~_e^(1/4)) y h^2 Omega_GW,0 = C_Omega eps Omega_GW,e, con eps =
      (a_e/a_RD)^(2(4-n)/(n+2)), C_f = 4.59e10 Hz y C_Omega = 1.61e-5 (Modelo Estándar); para n = 4, eps
      = 1 y omega_*/f_* = sqrt(lambda_eff).
    verificacion: >
      Derivación verificada con sympy partiendo de rho ~ a^(-3(1+w)), conservación de entropía y rho_GW
      ~ a^-4. Con g = g_s se reduce exactamente a Dufaux et al. 2007 Ecs. 45-47 (C_f = 3.97e10 contra
      4e10 Hz; C_Omega = 9.26e-6 contra 9.3e-6 con su Omega_rad). Contra Figueroa & Torrenti 2017 la
      amplitud difiere en (g_s0/g_0)^(4/3) = 1.22 (ellos toman g_s = g hoy) y la frecuencia en un factor
      6.4 ~ 2 pi que no se pudo reconciliar desde el texto. Prueba de punta a punta: lphi4 con q = 120
      da un pico 7.0e-11 en 1.09e8 Hz; con las constantes de Dufaux, 4.1e-11 en 9.5e7 Hz contra ~3e-11
      en ~7e7 Hz del paper (factor ~1.4, con código, condiciones iniciales y caja distintos). Firme para
      las fórmulas; la prueba de punta a punta es sólo de orden de magnitud.
    evidence:
      - code/verificar_reescaleo.py::sympy_reescaleo
      - code/verificar_reescaleo.py::comparar_literatura
      - code/reescaleo_gws.py::frecuencia_hoy
      - code/reescaleo_gws.py::omega_gw_hoy
      - Dufaux, Bergman, Felder, Kofman & Uzan, arXiv:0707.0875, Ecs. 44-47 y Fig. 4
      - Figueroa & Torrenti, arXiv:1707.04533, Ecs. 2.24-2.27
      - Notas/Notas.tex «Reescaleo a hoy» y «Comparación con la literatura»
    numbers: [C_f_SM, C_Omega_SM, omega_gamma_h2, Omega_rad_h2, C_f_dufaux, C_Omega_dufaux,
              C_Omega_dufaux_su_Orad, C_f_FT_sin_g, cociente_FT, q120_Omega_pico, q120_f_pico,
              q120_Omega_pico_const_dufaux, q120_f_pico_const_dufaux, q120_cociente_espectro_1_10]

  - id: chequeos-del-analisis
    statement: >
      Las ecuaciones de fondo en variables de programa que usa el analizador (Friedmann 1 y 2,
      continuidad, w autosimilar y envolvente a^(-6/(n+2))) son correctas, y en las corridas de lphi4
      los residuos de continuidad y de a'' quedan al nivel del error de Friedmann de CosmoLattice.
    verificacion: >
      sympy desde las ecuaciones en tiempo cósmico con d t~ = omega_* a^(-alpha) dt. En lphi4 N = 32:
      Friedmann 4.0e-4, continuidad 4.0e-4, a'' 2.6e-4 (con diferencias centradas eran ~2e-2, limitadas
      por tOutputFreq); <w> = 0.331 y 0.334 (N = 64, q = 120), contra 1/3. En la corrida q = 120 los
      residuos suben a ~2-3e-3 en la etapa no lineal, todavía limitados por el muestreo.
    evidence:
      - code/verificar_reescaleo.py::sympy_programa
      - code/verificar_reescaleo.py::sympy_autosimilar
      - code/analisis_cosmolattice.py::analizar
    numbers: [T_osc_lphi4, w_final_lphi4, residuo_continuidad_lphi4, residuo_app_lphi4,
              friedmann_lphi4_test, q120_w_final, q120_kIR_aH, q120_friedmann]

  - id: requisitos-memoria-tiempo
    statement: >
      En esta máquina (3.7 GB, i7-8565U) una corrida con 2 escalares y GWs ocupa ~10 MB + 148 B x N^3 y
      cuesta ~140 ns por sitio y por paso con 8 hilos; N <= 192 (1.06 GB) entra en la memoria libre, N =
      256 (2.5 GB) no. Con tMax = 500 y dt = 0.01: N = 64 ~0.5 h, N = 128 ~4 h, N = 192 ~14 h.
    verificacion: >
      Mediciones directas de memoria residente para N = 32-192 (la ley N^3 predice 1.06 GB para N = 192,
      medido 1.01 GB) y de tiempo por paso por diferencia de corridas para N = 64, 128, 192 (122-141
      ns/sitio). La corrida completa de gentmodel_cuartico.in con N = 64 confirma el tiempo total (ver
      numbers: n64_tiempo_total). N = 256 está extrapolado, no medido, para no forzar el swap.
    evidence:
      - code/recursos_cosmolattice.py
      - Notas/Notas.tex «Corridas cuárticas» (Tabla tab:recursos)
    numbers: [rss_gw_N32, rss_gw_N64, rss_gw_N128, rss_gw_N160, rss_gw_N192, bytes_por_sitio_gw,
              bytes_por_sitio_sin_gw, t_paso_N64, t_paso_N128, t_paso_N192, t_paso_sin_gw_N128,
              ns_por_sitio_gw, hilos_4_vs_8, n64_tiempo_total]

  - id: paso-temporal
    statement: >
      dt = 0.01 es estable y suficiente para los .in cuárticos hasta la dx de N = 192 con kIR = 0.7; el
      error de Friedmann escala como dt^2 y crece con N en la etapa no lineal (5.6e-4 con N = 32, 1.3e-3
      con N = 64); el rho_GW/rho final tiene una dispersión de ~10% entre corridas que no depende de dt.
    verificacion: >
      Barrido dt = 0.04-0.005 con N = 32 (Friedmann cae x4 por cada mitad de dt). Prueba UV con N = 32 y
      kIR = 2.8, 4.2 (dx de N = 128, 192): dt = 0.01 contra 0.005 cambia rho_GW/rho < 1%. La prueba UV
      se hizo en una caja chica sin resonancia (rho_GW/rho ~ 1e-15 a 1e-14), así que verifica la
      integración de los modos UV, no la etapa no lineal con N grande.
    evidence:
      - code/recursos_cosmolattice.py::dt_recomendado
      - Notas/Notas.tex «Corridas cuárticas», El paso temporal
    numbers: [dt_scan_friedmann_0.04, dt_scan_friedmann_0.02, dt_scan_friedmann_0.01,
              dt_scan_friedmann_0.005, dt_scan_rhogw_0.04, dt_scan_rhogw_0.02, dt_scan_rhogw_0.01,
              dt_scan_rhogw_0.005, rhogw_uv_k2.8_dt0.01, rhogw_uv_k2.8_dt0.005, rhogw_uv_k4.2_dt0.01,
              rhogw_uv_k4.2_dt0.005, n64_friedmann]

  - id: derivadas-correctas
    statement: >
      Las derivadas primera y segunda del potencial de programa escritas a mano en genmonomial.h,
      gentmodel.h y genemodel.h coinciden con las derivadas de los potenciales de Notas.tex.
    verificacion: >
      Comparación numérica contra la derivada simbólica de sympy en una grilla de n y phi~; además, para
      n = 2 la V' de gentmodel.h coincide término a término con la de tanh2.h. Firme.
    evidence:
      - code/verificar_genmodels.py::chequear_derivadas
      - models/tanh2.h::potDeriv
    numbers: [derivadas_max_diff]

  - id: condiciones-iniciales
    statement: >
      Los phi_0 y momentos iniciales de los tres .in corresponden a epsilon_V = 1 con la velocidad de
      slow-roll autoconsistente, phi'_0 = -sqrt((sqrt(7/3) - 1) V(phi_0)), igual en los tres modelos.
    verificacion: >
      El script recalcula los valores desde los parámetros de cada .in y los compara con lo escrito. La
      fórmula aplicada a tanh2.in da -3.02e31 contra el -3.07e31 de CosmoLattice (2 por ciento). El
      fondo exacto muestra que epsilon_V = 1 queda antes del final exacto (epsilon_H = 1); es una
      convención, la misma que usa tanh2.in.
    evidence:
      - code/verificar_genmodels.py::condiciones_iniciales
      - code/verificar_genmodels.py::fin_exacto
      - Notas/Notas.tex «Condiciones iniciales», «Momento inicial» y la sección de cada modelo
      - models/parameter-files/tanh2.in (initial_amplitudes, initial_momenta)
    numbers: [phi0_genmonomial, phi0_gentmodel, phi0_genemodel, pi0_genmonomial, pi0_gentmodel,
              pi0_genemodel, pi0_tanh2_formula, phi_fin_exacto_genmonomial, phi_fin_exacto_gentmodel,
              phi_fin_exacto_genemodel]

  - id: in-corregidos-corren
    statement: >
      Con los .in corregidos (momento inicial y, para n = 6, q = 1e2, dt = 1e-3, tMax = 20), las tres
      simulaciones corren hasta tMax sin NaN y conservan la ecuación de Friedmann a 1e-5.
    verificacion: >
      Corrida completa de los tres modelos con N = 64 y los .in tal como quedan en el repo.
    evidence:
      - code/probar_genmodels.sh
    numbers: [a_final_genmonomial, friedmann_max_rel]

  - id: in-cuarticos
    statement: >
      Los .in gentmodel_cuartico, genemodel_cuartico y genemodel_cuartico_aK5 tienen los parámetros de
      la Tabla de Notas.tex «Parámetros cosmológicos para modelos cuárticos», corren con withGWs = true
      y su tMax (500, 600) cubre la saturación de rho_GW/rho.
    verificacion: >
      chequear_in compara los valores con parametros_cuarticos.py. Corridas completas con N = 32 hasta
      t~ = 500 de los tres; el E-model con alpha_K = 1 todavía crece ~10% en t~ = 500, de ahí tMax =
      600. Los tiempos de saturación se midieron con N = 32 y pueden cambiar con N.
    evidence:
      - code/parametros_cuarticos.py::chequear_in
      - code/analisis_cosmolattice.py::analizar
      - models/parameter-files/gentmodel_cuartico.in
      - models/parameter-files/genemodel_cuartico.in
      - models/parameter-files/genemodel_cuartico_aK5.in
    numbers: [in_cuarticos_max_diff, t90_T, t90_E1, t90_E5, aH0_T, aH0_E1, aH0_E5, n64_w, n64_rhogw,
              n64_t90, n64_Omega_pico, n64_f_pico, n64_kIR_aH, rhogw_N32_t500_T]
  - id: corridas-N64
    statement: >
      Con N = 64 los tres casos cuárticos del paper dan picos h^2 Omega_GW ~ 6-9e-11 entre 4e8 y 1e9 Hz,
      con frecuencias ordenadas como omega_*/f_*; el monomial de control resuena antes y tiene más
      potencia UV (k~ > 10) que el T-model con el mismo lambda_eff, con un pico de amplitud similar.
    verificacion: >
      Corridas completas con tMax del .in; rho_GW/rho crece < 5% en los últimos 100 de t~ (saturado), w
      = 1/3 a 0.5%, Friedmann <= 2.4e-3, todos los modos dentro del horizonte al final. La corrida T
      repite la de validación con otra semilla: rho_GW/rho 1.116e-5 contra 1.114e-5. Bins de 20-25% en
      el pico (kIR = 0.7), así que diferencias de frecuencia menores no son significativas.
    evidence:
      - code/correr_cuarticos.sh
      - code/analisis_cosmolattice.py::analizar
    numbers: [N64_T_f_pico, N64_T_Omega_pico, N64_T_rhogw, N64_T_friedmann, N64_T_w, N64_T_t90,
