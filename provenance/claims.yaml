claims:
  - id: parametros-cuarticos
    statement: >
      Para n = 4, los casos E-model alpha_K = 1, T-model alpha_K = 1 y E-model alpha_K = 5 de Ellis,
      Garcia, Olive y Verner (2026) corresponden, en la convención de genemodel/gentmodel, a los M, A,
      phi_0 y phi'_0 de la Tabla de Notas.tex «Parámetros cosmológicos para modelos cuárticos», con
      lambda normalizado a A_s = 2.1e-9 y n_s ~ 0.965, r < 0.02, compatibles con Planck 2018 según el
      paper.
    verificacion: >
      El mismo código con alpha_K = 1 y N_* = 55 reproduce la Tabla II del paper: n_s idéntico a 4
      cifras para E y T, r a menos de 1 por ciento (slow-roll contra perturbaciones exactas). El lambda
      del T-model coincide con la Ec. 38 del paper; en el E-model la Ec. 38 da 5-13 por ciento más,
      consistente con que es una aproximación. Las cotas observacionales (alpha_K < 17 E, < 11 T) y la
      compatibilidad con los datos se toman del paper, no se recalculan.
    evidence:
      - code/parametros_cuarticos.py::calcular
      - code/parametros_cuarticos.py::chequeo_tabla_II
      - Ellis, Garcia, Olive & Verner, PRD 113, 063571 (2026), Ecs. 18, 38-40, B15, Tabla II, Sec. VII.B, Figs. 5-6
      - Notas/Notas.tex «Parámetros cosmológicos para modelos cuárticos» (Tabla tab:parametros-cuarticos)
    numbers: [cuartico_E1_ns, cuartico_E1_r, cuartico_E1_lam, cuartico_E1_H_star, cuartico_E1_M,
              cuartico_E1_A, cuartico_E1_phi0, cuartico_E1_pi0, cuartico_E1_omega_star,
              cuartico_E1_lam_eff, cuartico_E1_phi0_sobre_M, cuartico_T1_ns, cuartico_T1_r,
              cuartico_T1_lam, cuartico_T1_H_star, cuartico_T1_M, cuartico_T1_A, cuartico_T1_phi0,
              cuartico_T1_pi0, cuartico_T1_omega_star, cuartico_T1_lam_eff, cuartico_T1_phi0_sobre_M,
              cuartico_E5_ns, cuartico_E5_r, cuartico_E5_lam, cuartico_E5_H_star, cuartico_E5_M,
              cuartico_E5_A, cuartico_E5_phi0, cuartico_E5_pi0, cuartico_E5_omega_star,
